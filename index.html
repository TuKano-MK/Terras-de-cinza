<style>
:root{
  /* Layout: coluna única de console de jogo, 560px no máximo. Faixa de status no topo, cena e ações empilhadas abaixo. */
  --ink:#0E1517;
  --panel:#152024;
  --panel2:#1C2A2F;
  --line:#2D4147;
  --bone:#E8E4D5;
  --mute:#A3B4B4;
  --torch:#E3A33A;
  --torch-ink:#1B1204;
  --blood:#E0705F;
  --moss:#7CC39A;
  --arcane:#7FB2E0;
  --display:'Grenze Gotisch','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background-color:var(--ink);
  background-image:radial-gradient(70% 320px at 50% 0,rgba(227,163,58,.10),transparent);
  background-repeat:no-repeat;
  color:var(--bone);
  font-family:var(--body);
  font-size:17px;
  line-height:1.45;
  padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(40px,12vw,56px);letter-spacing:.01em}
h2{font-size:30px}
h3{font-size:24px}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--torch)}
.mute{color:var(--mute)}
.small{font-size:15px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

/* botões */
.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 16px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--bone);cursor:pointer;text-align:center}
.btn:hover:not(:disabled){border-color:var(--torch)}
.btn.primary{background:var(--torch);color:var(--torch-ink);border-color:var(--torch)}
.btn.primary:hover:not(:disabled){background:#EDB452}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:400;font-size:14px;color:var(--mute)}
.btn.primary small{color:var(--torch-ink)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions .wide{grid-column:1/-1}

/* barras */
.bar{height:8px;background:#0A1012;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;transition:width .25s}
.bar.hp span{background:var(--moss)}
.bar.foe span{background:var(--blood)}
.bar.xp span{background:var(--arcane)}
.bar.sp span{background:var(--torch)}
.bar.st span{background:var(--torch)}

/* criação */
.races{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.races{grid-template-columns:repeat(3,minmax(0,1fr))}}
.race{font:inherit;color:var(--bone);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.race[aria-pressed="true"]{border-color:var(--torch);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--torch)}
.race b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.race span.l{font-size:14px;color:var(--mute);line-height:1.25}
.glyph{width:38px;height:38px;border-radius:50%;background:var(--c);color:#10181A;display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.statrow{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:15px}
.statrow b{text-align:right;font-weight:500}
.perk{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--line)}
.perk b{color:var(--torch)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text]{font:inherit;font-weight:400;min-height:48px;padding:8px 12px;border-radius:5px;border:1px solid var(--line);background:#0E181B;color:var(--bone)}

/* faixa de status */
.hud{display:flex;flex-direction:column;gap:10px}
.hudtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.who small{display:block;color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--mute)}
.chips b{color:var(--bone);font-weight:500}
.track{display:flex;gap:5px;align-items:center}
.track i{flex:1;height:6px;border-radius:1px;background:var(--line)}
.track i.done{background:var(--torch)}
.track i.now{background:transparent;box-shadow:inset 0 0 0 2px var(--torch)}

/* mapa */
.dest{display:flex;flex-direction:column;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;border-radius:3px}
.tag.combate,.tag.boss{color:var(--blood)}
.tag.elite{color:var(--torch)}
.tag.evento{color:var(--arcane)}
.tag.mercador,.tag.descanso{color:var(--moss)}
.tag.neutro{color:var(--mute)}

/* combate */
.foe-name{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.log{min-height:9.5em;display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.log p{font-size:16px}
.log .hit{color:var(--bone)}
.log .crit{color:var(--torch);font-weight:700}
.log .hurt{color:var(--blood)}
.log .good{color:var(--moss)}
.log .warn{color:var(--torch);font-weight:700}
.log .dim{color:var(--mute)}
.notice{padding:10px 12px;border-left:3px solid var(--torch);background:var(--panel2);font-size:16px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.item .btn{min-width:96px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.facts b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.facts span{font-size:14px;color:var(--mute)}

/* status */
.attr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.attr b{font-size:18px}
.attr .v{font-family:var(--mono);font-size:18px;color:var(--torch);margin-left:8px}
.derived{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:15px}
.derived div{display:flex;justify-content:space-between;gap:8px;color:var(--mute)}
.derived b{color:var(--bone);font-weight:500;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- novo jogo ---------- */
function newGame(key,nome){
  var r=RACES[key],a={};
  for(var k in r.a) a[k]=r.a[k];
  G={race:key,nome:nome,lvl:1,xp:0,pts:0,a:a,hp:0,sp:0,gold:15,potions:2,stage:0,
     giant:key==='orc'&&chance(35),
     opts:[],dest:null,event:null,eventResult:null,fight:null,ret:'map',
     pre:'',rested:false,forged:false,bought:{forca:0,res:0,vig:0,mag:0},notice:''};

  if(key==='orc') n+=G.giant?' Você nasceu com o dom da Gigantificação!':' Você não tem o dom da Gigantificação, mas luta como um orc mesmo assim.';

/* ---------- mapa de caminhos ---------- */
function tierFor(stage){return stage<3?1:(stage<6?2:3)}
function genOptions(stage){
  if(isBossStage(stage)){var BO=bossFor(stage);
    return [{tipo:'boss',regiao:BO.reg,terreno:BO.reg,nome:BO.place,txt:BO.txt,tier:4}];
  }
  var tier=tierFor(stage);
  var pool=['combate','combate','combate','combate','evento','evento','mercador','descanso'];
  if(stage>=2) pool.push('elite','elite');
  var out=[],tries=0,nomes={};
  while(out.length<3&&tries<60){
    tries++;
    var tipo=pick(pool);
    if(stage===0&&tipo==='descanso') continue;
    if((tipo==='mercador'||tipo==='descanso')&&out.some(function(o){return o.tipo===tipo})) continue;
    var rk=regPick(stage),R=REGIOES[rk],nome=pick(R.nomes);
    if(nomes[nome]) continue;
    nomes[nome]=1;
    out.push({tipo:tipo,regiao:rk,terreno:R.terreno,nome:nome,txt:R.txt,tier:tier});
  }
  if(!out.some(function(o){return o.tipo==='combate'||o.tipo==='elite'})){
    var rk2=regPick(stage);
    out[out.length-1]={tipo:'combate',regiao:rk2,terreno:REGIOES[rk2].terreno,nome:pick(REGIOES[rk2].nomes),txt:REGIOES[rk2].txt,tier:tier};
  }
  return out;
}
function completeStage(){
  G.stage++;
  G.rested=false;G.forged=false;G.event=null;G.eventResult=null;G.dest=null;
  G.opts=genOptions(G.stage);
  view='map';
  if(isBossStage(G.stage)){
    var hh=heal(Math.round(maxHp()*0.4));
    G.pre='Antes de enfrentar '+bossShort(G.stage)+', você acampa e recupera '+hh+' de vida. O ar fica pesado.';
  }
  render();
}
function danger(d){
  if(d.tipo==='boss') return 'Perigo: extremo';
  if(d.tipo==='elite') return 'Perigo: alto';
  return d.tier===1?'Perigo: baixo':'Perigo: médio';
}
function dicaTipo(d){
  if(d.tipo==='combate') return 'Algo hostil espreita por aqui.';
  if(d.tipo==='elite') return 'Um inimigo forte guarda este lugar. Recompensa maior.';
  if(d.tipo==='evento') return 'Algo incomum acontece aqui.';
  if(d.tipo==='mercador') return 'Um mercador de estrada armou tenda neste lugar.';
  if(d.tipo==='descanso') return 'Um canto quieto para recuperar as forças.';
  return '';
}
function chooseDest(i){
  var d=G.opts[i]; if(!d) return;
  G.dest=d; G.notice='';
  if(d.tipo==='combate'||d.tipo==='elite'||d.tipo==='boss'){startFight(d)}
  else if(d.tipo==='evento'){G.event=pickEvent(d);G.eventResult=null;view='event';render()}
  else if(d.tipo==='mercador'){view='shop';render()}
  else if(d.tipo==='descanso'){
    var pct=0.5+(G.race==='elfo'&&d.terreno==='floresta'?0.2:0);
    var h=Math.min(Math.round(maxHp()*pct),maxHp()-G.hp);G.hp+=h;
    var t='Você descansa em '+d.nome+' e recupera '+h+' de vida.';
    if(pct>0.5) t+=' A floresta ajudou a curar mais depressa.';
    completeStage();G.notice=t;render();
  }
}
function shortcut(i){
  var d=G.opts[i];
  if(!d||G.race!=='elfo'||d.terreno!=='floresta'||(d.tipo!=='combate'&&d.tipo!=='elite')) return;
  completeStage();
  G.notice='A floresta abre um caminho secreto. Você passa por '+d.nome+' sem ser visto.';
  render();
}
function restMap(){
  if(G.rested) return;
  var h=Math.min(Math.round(maxHp()*0.25),maxHp()-G.hp);
  G.hp+=h;G.rested=true;
  G.notice='Você faz uma pausa e recupera '+h+' de vida.';
  render();
}
function forge(kind){
  if(G.race!=='anao'||G.forged||G.gold<15) return;
  G.gold-=15;G.forged=true;
  if(kind==='arma'){G.a.forca++;G.notice='Você forja uma lâmina melhor. Força +1.'}
  else{G.a.res++;G.notice='Você reforça a armadura. Resistência +1.'}
  render();
}

/* ---------- experiência ---------- */
function gainXp(n){
  G.xp+=n;
  var ups=0;
  while(G.xp>=needXp(G.lvl)){
    G.xp-=needXp(G.lvl);G.lvl++;G.pts+=3;ups++;
    G.hp=Math.min(maxHp(),G.hp+Math.round(maxHp()*0.25));
  }
  return ups;
}
function upMsg(ups){return ups>0?' Você subiu para o nível '+G.lvl+' e ganhou '+(ups*3)+' pontos de atributo.':''}

/* ---------- combate ---------- */
function makeEnemy(d){
  if(d.tipo==='boss'||d.boss){var BB=bossFor(G.stage),b={};for(var k in BB)b[k]=BB[k];b.hpMax=b.hp;return b}
  var tier=d.tier,elite=d.tipo==='elite';
  var want=elite?Math.min(3,tier+1):tier;
  var list=INIMIGOS.filter(function(x){return x.t===want&&x.r===d.regiao});
  if(!list.length) list=INIMIGOS.filter(function(x){return x.t===want});
  var base=d.name?(INIMIGOS.filter(function(x){return x.nome===d.name})[0]||pick(list)):pick(list),e={};
  for(var k2 in base) e[k2]=base[k2];
  if(elite){
    e.nome=e.nome+' (elite)';
    if(tier===3){e.hp=Math.round(e.hp*1.25);e.atk=Math.round(e.atk*1.1)}
    e.xp=Math.round(e.xp*1.5);
    e.ouro=[Math.round(e.ouro[0]*1.6),Math.round(e.ouro[1]*1.6)];
  }
  if(base.t>=2){e.hp=Math.round(e.hp*0.85);e.atk=Math.max(5,e.atk-2)}
  var act=Math.floor(G.stage/10);if(act>0){e.hp=Math.round(e.hp*(1+.32*act));e.atk=Math.round(e.atk*(1+.22*act));e.def+=act;e.xp=Math.round(e.xp*(1+.5*act));e.ouro=[Math.round(e.ouro[0]*(1+.5*act)),Math.round(e.ouro[1]*(1+.5*act))]}
  var lv=d.lvl||1,lvE=lv>20?20+(lv-20)*.5:lv,hm=1.5*(1+.08*(lvE-1)),am=1.1*(1+.05*(lvE-1)),gm=1+.08*(lvE-1);e.hp=Math.round(e.hp*hm);e.atk=Math.round(e.atk*am);e.def+=Math.floor(lvE/4);e.xp=Math.round(e.xp*gm);e.ouro=[Math.round(e.ouro[0]*gm),Math.round(e.ouro[1]*gm)];
  e.elite=elite;e.hpMax=e.hp;
  return e;
}
function startFight(d,enemy){
  var e=enemy||makeEnemy(d);var DF=window.TC_DIF||{h:1,a:1};e.hp=Math.round(e.hp*DF.h);e.hpMax=e.hp;e.atk=Math.max(1,Math.round(e.atk*DF.a));e.def+=DF.d||0;
  G.fight={e:e,hp:e.hp,turn:1,giant:0,giantUsed:false,guard:false,dest:d,log:[{t:e.intro,c:'dim'}]};
  G.sp=maxSp();
  view='fight';
  if(G.race==='barbaro'){
    log('Instinto de Bárbaro: seus sentidos despertam e você ataca primeiro.','good');
    strike('fis');
    if(G.fight.hp<=0){win();return}
  }
  if(inForest()) log('A floresta guia os seus passos.','good');
  render();
}
function log(t,c){var f=G.fight;f.log.push({t:t,c:c||'hit'});if(f.log.length>40)f.log.shift()}
function strike(kind){
  var f=G.fight,e=f.e;
  if(!chance(hitChance(e))){log(kind==='mag'?'Sua magia se dissipa antes de atingir o alvo.':'Você erra o golpe.','dim');return 0}
  var base=kind==='mag'?2+G.a.mag*1.4+rnd(0,3)+EQ('mdmg'):3+G.a.forca*0.9+rnd(0,3)+EQ('dmg');
  var m=1;
  if(f.giant>0&&kind!=='mag') m*=1.5;
  var crit=chance(critChance());
  if(crit) m*=1.6;
  var def=kind==='mag'?Math.floor(e.def/2):e.def;
  var d=Math.max(1,Math.round(base*m)-def);
  f.hp=Math.max(0,f.hp-d);
  log((crit?'Crítico! ':'')+(kind==='mag'?'Sua magia causa ':'Você causa ')+d+' de dano.',crit?'crit':'hit');
  return d;
}
function enemyTurn(){
  var f=G.fight,e=f.e;
  if(chance(esqChance())){log('Você se esquiva do ataque de '+e.nome+'.','good');f.guard=false;return}
  var breath=e.boss&&f.turn%3===0;
  if(!breath&&!chance(88)){log(e.nome+' erra o ataque.','dim');f.guard=false;return}
  var raw=breath?Math.round(e.atk*1.4)+rnd(0,3):e.atk+rnd(0,2);
  var red=breath?Math.floor(redDmg()/2):redDmg();
  var d=Math.max(1,raw-red);
  if(f.guard){d=Math.max(1,Math.floor(d/2));f.guard=false}
  G.hp=Math.max(0,G.hp-d);
  log(breath?'Sopro de Cinzas! Você sofre '+d+' de dano.':e.nome+' acerta você: '+d+' de dano.','hurt');
}
function playerAction(kind){
  var f=G.fight;if(!f) return;
  if(kind==='potion'){
    if(G.potions<1) return;
    G.potions--;
    var h=Math.min(22,maxHp()-G.hp);G.hp+=h;
    log('Você bebe uma poção e recupera '+h+' de vida.','good');
  } else if(kind==='flee'){
    if(!G.wild) return;
    if(chance(clamp(40+G.a.vig*4,40,85))){var wm=G.wild;G.wild=null;G.fled=wm;G.fight=null;G.notice='Você escapou de '+f.e.nome+'.';view='map';render();return}
    log('Você tenta fugir, mas não consegue.','dim');
  } else if(kind==='guard'){
    f.guard=true;G.sp=Math.min(maxSp(),G.sp+5);
    log('Você se protege e recupera o fôlego.','good');
  } else if(kind==='giant'){
    if(!G.giant||f.giantUsed||G.sp<4) return;
    G.sp-=4;f.giantUsed=true;f.giant=4;
    var h2=Math.min(Math.round(maxHp()*0.1),maxHp()-G.hp);G.hp+=h2;
    log('Gigantificação! Seu corpo cresce e a pele endurece. +'+h2+' de vida.','good');
  } else if(kind==='magic'){
    if(G.a.mag<1||G.sp<6) return;
    G.sp-=6;strike('mag');
  } else {
    if(G.sp<2) return;
    G.sp-=2;strike('fis');
  }
  if(f.hp<=0){win();return}
  enemyTurn();
  if(G.hp<=0){view='lose';render();return}
  if(f.e.boss&&f.turn%3===2) log(f.e.nome.split(',')[0]+' reúne forças. O próximo ataque será pior.','warn');
  f.turn++;
  if(f.giant>0){f.giant--;if(f.giant===0) log('Você volta ao tamanho normal.','dim')}
  G.sp=Math.min(maxSp(),G.sp+regenSp());
  render();
}
function win(){
  var f=G.fight,e=f.e;
  var gold=rnd(e.ouro[0],e.ouro[1]);
  if(G.race==='anao') gold=Math.round(gold*1.25);
  G.gold+=gold;
  var ups=gainXp(e.xp);
  if(e.boss){G.fight=null;if(G.stage>=ETAPAS-1){view='win';render();return}
    var bx=bossShort(G.stage),bh=heal(Math.round(maxHp()*0.5)),bg=40+30*Math.floor(G.stage/10),bi=mkItem(pick(Object.keys(TIPOS_IT)),Math.min(G.stage<30?2:3,2+Math.floor(G.stage/20)));G.gold+=bg;G.pot=0;G.potions++;
    var bl=gainItem(bi)?(dropToast(bi),' Item: '+bi.n+' ('+RAR[bi.r].n+').'):' A mochila está cheia e o item ficou para trás.';
    var bu=gainXp(60+20*Math.floor(G.stage/10));completeStage();G.notice=bx+' caiu! +'+bg+' de ouro, +1 poção, recuperou '+bh+' de vida.'+bl+upMsg(bu);render();return}
  var drop='';
  if(chance(e.elite?60:30)){G.potions++;drop=' Você encontra uma poção.'}
  drop+=lootMsg(e);if(G.cls==='curador'){var chh=heal(Math.ceil(maxHp()*.1));if(chh>0)drop+=' O curador recupera '+chh+' de vida.'}
  var txt=e.nome+' caiu. +'+e.xp+' XP, +'+gold+' de ouro.'+drop+upMsg(ups);
  G.fight=null;
  if(G.wild){G.wild=null;G.wonWild=true;G.notice=txt;view='map';render();return}
  completeStage();
  G.notice=txt;
  render();
}

/* ---------- loja ---------- */
function buy(id){
  var it=LOJA.filter(function(x){return x.id===id})[0];
  if(!it) return;
  var p=precoLoja(it.preco);
  if(G.gold<p) return;
  if(it.max&&G.bought[id]>=it.max) return;
  G.gold-=p;
  if(id==='pocao') G.potions++;
  else{G.a[id]++;G.bought[id]++}
  G.notice='Você comprou: '+it.nome+'.';
  render();
}

/* ---------- status ---------- */
function addPoint(k){
  if(G.pts<1||!(k in G.a)) return;
  G.a[k]++;G.pts--;
  if(k==='vid') G.hp+=4;
  render();
}
